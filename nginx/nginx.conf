events {}
http {
  # Use Docker's embedded DNS for dynamic name resolution
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Single HTTP server behind Cloudflare Tunnel
  server {
    listen 80;
    server_name tecnica7ldz.edu.ar www.tecnica7ldz.edu.ar manuelsadosky.tecnica7ldz.edu.ar;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Gzip for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/octet-stream image/svg+xml;
    gzip_min_length 1024;

    # Proxy to Node app service
    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Optional: serve static assets directly if needed
    location /assets/ {
      proxy_pass http://app:3000/assets/;
    }
  }
}
